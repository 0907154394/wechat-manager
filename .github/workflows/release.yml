name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Create app-config.json from secret
        run: echo '${{ secrets.APP_CONFIG }}' > app-config.json

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: npm run release
