<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã xác thực WeChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Hero header (giống shop) ─────────────────────────── */
        .hero {
            background: linear-gradient(135deg, #020617 0%, #022c22 50%, #020617 100%);
            padding: 22px 0 28px;
            border-bottom: 1px solid rgba(16,185,129,.2);
        }
        .hero-inner {
            width: min(680px, 92%);
            margin: 0 auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .brand-icon {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800; color: #fff;
            flex-shrink: 0;
        }
        .brand-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.2px;
        }
        .hero-title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }
        .hero-sub {
            font-size: 13px;
            color: #6ee7b7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .refresh-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #6ee7b7;
        }
        .countdown-num {
            color: #34d399;
            font-weight: 700;
        }
        .reload-btn {
            padding: 5px 14px;
            background: rgba(16,185,129,.15);
            color: #34d399;
            border: 1px solid rgba(16,185,129,.35);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
            font-family: inherit;
        }
        .reload-btn:hover { background: rgba(16,185,129,.25); }
        .reload-btn.spinning { opacity: .5; pointer-events: none; }

        /* Progress bar */
        .refresh-bar {
            height: 2px;
            background: rgba(16,185,129,.15);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 18px;
        }
        .refresh-progress {
            height: 100%;
            background: linear-gradient(90deg, #059669, #34d399);
            border-radius: 2px;
            transition: width 1s linear;
        }

        /* ── Content area ─────────────────────────────────────── */
        .container {
            width: min(680px, 92%);
            margin: 0 auto;
            padding: 28px 0 60px;
        }

        /* Message card */
        .message {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            transition: box-shadow .2s, transform .2s;
        }
        .message:first-child {
            border-color: #a7f3d0;
            box-shadow: 0 0 0 1px #a7f3d0, 0 4px 12px rgba(16,185,129,.1);
        }
        .message:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,.1);
            transform: translateY(-1px);
        }

        .msg-meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .msg-info { flex: 1; min-width: 0; }
        .msg-subject {
            font-weight: 700;
            color: #0f172a;
            font-size: 14px;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .msg-sender {
            color: #059669;
            font-size: 12px;
            font-weight: 500;
        }
        .msg-time {
            color: #94a3b8;
            font-size: 11.5px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* Code highlight box */
        .code-box {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .code-label {
            font-size: 11px;
            color: #059669;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .code-value {
            font-size: 28px;
            font-weight: 800;
            color: #065f46;
            letter-spacing: 6px;
            font-family: 'Plus Jakarta Sans', monospace;
            line-height: 1;
        }
        .copy-code-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity .15s, transform .1s;
            flex-shrink: 0;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(5,150,105,.3);
        }
        .copy-code-btn:hover { opacity: .9; transform: translateY(-1px); }
        .copy-code-btn:active { transform: translateY(0); }
        .copy-code-btn.copied {
            background: linear-gradient(135deg, #047857, #059669);
        }

        /* Email body */
        .msg-body {
            color: #475569;
            font-size: 13px;
            line-height: 1.7;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #f1f5f9;
            max-height: 180px;
            overflow-y: auto;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg-body::-webkit-scrollbar { width: 4px; }
        .msg-body::-webkit-scrollbar-track { background: transparent; }
        .msg-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        .code-inline {
            background: #d1fae5;
            color: #065f46;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Empty / error states */
        .empty-msg {
            text-align: center;
            padding: 60px 0 40px;
            color: #94a3b8;
            font-size: 14px;
        }
        .empty-icon {
            font-size: 40px;
            margin-bottom: 14px;
            opacity: .5;
        }
        .empty-msg p {
            color: #64748b;
            font-weight: 500;
        }
        .empty-msg small {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 6px;
            display: block;
        }
        .error-box {
            background: #fff;
            border: 1px solid #fecaca;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            color: #dc2626;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: #059669;
            color: #fff;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(5,150,105,.4);
            font-family: inherit;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message { animation: fadeInUp .25s ease both; }
        .message:nth-child(1) { animation-delay: .04s; }
        .message:nth-child(2) { animation-delay: .08s; }
        .message:nth-child(3) { animation-delay: .12s; }
    </style>
</head>
<body>

<div class="hero">
    <div class="hero-inner">
        <div class="brand">
            <div class="brand-icon">W</div>
            <span class="brand-name">WeChat Shop VN</span>
        </div>
        <div class="hero-title">Mã xác thực của bạn</div>
        <div class="hero-sub">
            <span>Trang tự động làm mới để cập nhật mã mới nhất</span>
            <div class="refresh-info">
                <span>Làm mới sau <span class="countdown-num" id="countdown">30</span>s</span>
                <button class="reload-btn" id="reloadBtn" onclick="manualReload()">&#8635; Tải lại</button>
            </div>
        </div>
        <div class="refresh-bar">
            <div class="refresh-progress" id="progressBar" style="width:100%"></div>
        </div>
    </div>
</div>

<div class="container">
    <div id="messageList"></div>
</div>

<div id="toast"></div>

<script>
    const REFRESH_SEC = 30;
    let currentToken = "";
    let countdownVal = REFRESH_SEC;
    let countdownTimer = null;

    window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        currentToken = params.get("token") || "";

        if (!currentToken) {
            document.getElementById("messageList").innerHTML =
                '<div class="error-box">Link không hợp lệ hoặc đã hết hạn.</div>';
            document.getElementById("reloadBtn").closest(".refresh-info").style.display = "none";
            return;
        }

        loadMessages();
        startCountdown();
    };

    async function loadMessages() {
        try {
            const res = await fetch("/api/messages/" + encodeURIComponent(currentToken));
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                document.getElementById("messageList").innerHTML =
                    '<div class="error-box">' + escapeHtml(data.message || "Không tải được dữ liệu") + "</div>";
                return;
            }

            const msgs = Array.isArray(data.messages) ? data.messages : [];

            if (!msgs.length) {
                document.getElementById("messageList").innerHTML =
                    '<div class="empty-msg"><div class="empty-icon">&#9993;</div><p>Chưa có tin nhắn nào.</p><small>Trang sẽ tự động cập nhật khi có mã mới.</small></div>';
                return;
            }

            let html = "";
            msgs.forEach(function (msg) {
                const cleanContent = cleanEmailContent(msg.content || "");
                const code = extractCode(msg.content || "");
                const bodyHtml = highlightCode(escapeHtml(cleanContent));
                const timeStr = new Date(msg.createdAt).toLocaleString("vi-VN");

                html += '<div class="message">';

                html += '<div class="msg-meta">';
                html += '<div class="msg-info">';
                html += '<div class="msg-subject">' + escapeHtml(msg.subject || "(Không có tiêu đề)") + '</div>';
                html += '<div class="msg-sender">Từ: ' + escapeHtml(msg.sender || "-") + '</div>';
                html += '</div>';
                html += '<div class="msg-time">' + timeStr + '</div>';
                html += '</div>';

                if (code) {
                    html += '<div class="code-box">';
                    html += '<div>';
                    html += '<div class="code-label">Mã xác thực</div>';
                    html += '<div class="code-value">' + escapeHtml(code) + '</div>';
                    html += '</div>';
                    html += '<button class="copy-code-btn" onclick="copyCode(this, \'' + escapeJs(code) + '\')">Copy mã</button>';
                    html += '</div>';
                }

                html += '<div class="msg-body">' + bodyHtml + '</div>';
                html += '</div>';
            });

            document.getElementById("messageList").innerHTML = html;
        } catch (e) {
            console.error("loadMessages error:", e);
        }
    }

    function parseMimeHeaders(headerBlock) {
        const unfolded = headerBlock.replace(/\r?\n[ \t]+/g, " ");
        const ctM  = unfolded.match(/Content-Type:\s*([^\s;]+)/i);
        const cteM = unfolded.match(/Content-Transfer-Encoding:\s*(\S+)/i);
        const bndM = unfolded.match(/boundary\s*=\s*["']?([^"'\r\n;]+)/i);
        return {
            contentType: ctM  ? ctM[1].toLowerCase()  : "",
            encoding:    cteM ? cteM[1].toLowerCase()  : "7bit",
            boundary:    bndM ? bndM[1].trim().replace(/["']/g, "") : ""
        };
    }

    function decodeMimePart(body, encoding) {
        if (encoding === "base64") {
            try { return atob(body.replace(/\s/g, "")); } catch { return body; }
        }
        if (encoding === "quoted-printable") {
            return body.replace(/=\r?\n/g, "")
                       .replace(/=([0-9A-Fa-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
        }
        return body;
    }

    function rescueMime(text) {
        const bndMatch = text.match(/boundary\s*=\s*["']?([^"'\r\n;]{4,})/i)
                      || text.match(/^-{4,}([^\r\n]+)/m);
        const boundary = bndMatch ? bndMatch[1].trim().replace(/["']/g, "") : null;

        if (boundary) {
            const escaped = boundary.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&");
            const parts = text.split(new RegExp(`\r?\n?--${escaped}(?:--)?[ \t]*\r?\n`, "g")).slice(1);
            let htmlFallback = "";

            for (const part of parts) {
                const blankIdx = part.search(/\r?\n\r?\n/);
                if (blankIdx < 0) continue;
                const { contentType, encoding } = parseMimeHeaders(part.substring(0, blankIdx));
                const body = part.substring(blankIdx).replace(/^\r?\n|\r?\n$/, "").trim();
                if (!body) continue;

                if (contentType === "text/plain") {
                    const decoded = decodeMimePart(body, encoding).trim();
                    if (decoded) return decoded;
                }
                if (contentType === "text/html" && !htmlFallback) {
                    htmlFallback = decodeMimePart(body, encoding)
                        .replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
                }
            }
            if (htmlFallback) return htmlFallback;
        }
        return null;
    }

    function cleanEmailContent(text) {
        if (!text) return "";
        if (/^-{4,}/m.test(text) || /^Content-Type:/im.test(text)) {
            const rescued = rescueMime(text);
            if (rescued) text = rescued;
        }
        text = text.replace(/^Content-[^\n]+\n/gim, "")
                   .replace(/^[ \t]+[^\n]+\n/gm, match =>
                       /["';=]/.test(match) ? "" : match
                   ).trim();
        const base64Block = text.replace(/\s/g, "");
        if (base64Block.length > 60 && /^[A-Za-z0-9+/]+=*$/.test(base64Block)) {
            try {
                const decoded = atob(base64Block);
                if (/[\x20-\x7E]/.test(decoded)) text = decoded;
            } catch {}
        }
        if (/<[a-z][^>]*>/i.test(text)) text = text.replace(/<[^>]+>/g, " ");
        const lines = text.split(/\r?\n/);
        const cleaned = [];
        let blankRun = 0;
        for (const line of lines) {
            const t = line.trimEnd();
            if (!t.trim()) {
                blankRun++;
                if (blankRun <= 1) cleaned.push("");
            } else {
                blankRun = 0;
                cleaned.push(t.trimStart());
            }
        }
        while (cleaned.length && !cleaned[0].trim()) cleaned.shift();
        while (cleaned.length && !cleaned[cleaned.length - 1].trim()) cleaned.pop();
        return cleaned.join("\n");
    }

    function extractCode(text) {
        const match = text.match(/\b(\d{4,8})\b/);
        return match ? match[1] : "";
    }

    function highlightCode(htmlText) {
        return htmlText.replace(/\b(\d{4,8})\b/g, function (m) {
            return '<span class="code-inline">' + m + "</span>";
        });
    }

    function copyCode(btn, code) {
        const write = function () {
            btn.textContent = "Đã copy!";
            btn.classList.add("copied");
            showToast("Đã copy mã: " + code);
            setTimeout(function () {
                btn.textContent = "Copy mã";
                btn.classList.remove("copied");
            }, 2000);
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(code).then(write).catch(fallback);
        } else { fallback(); }
        function fallback() {
            const ta = document.createElement("textarea");
            ta.value = code;
            ta.style.cssText = "position:fixed;left:-9999px;top:-9999px";
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); write(); } catch {}
            document.body.removeChild(ta);
        }
    }

    function manualReload() {
        const btn = document.getElementById("reloadBtn");
        if (btn) btn.classList.add("spinning");
        loadMessages().finally(function () {
            countdownVal = REFRESH_SEC;
            updateCountdownUI();
            if (btn) btn.classList.remove("spinning");
        });
    }

    function startCountdown() {
        countdownVal = REFRESH_SEC;
        updateCountdownUI();
        countdownTimer = setInterval(function () {
            countdownVal--;
            if (countdownVal <= 0) {
                countdownVal = REFRESH_SEC;
                loadMessages();
            }
            updateCountdownUI();
        }, 1000);
    }

    function updateCountdownUI() {
        const el = document.getElementById("countdown");
        if (el) el.textContent = countdownVal;
        const bar = document.getElementById("progressBar");
        if (bar) bar.style.width = ((countdownVal / REFRESH_SEC) * 100) + "%";
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.opacity = "1";
        clearTimeout(t._timer);
        t._timer = setTimeout(function () { t.style.opacity = "0"; }, 2000);
    }

    function escapeHtml(v) {
        return String(v)
            .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function escapeJs(v) {
        return String(v)
            .replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', '\\"')
            .replaceAll("\n", "\\n").replaceAll("\r", "\\r");
    }
</script>
</body>
</html>
